{% extends "base.html" %}{% block title %}Join · BookNest{% endblock %}{% block content %}
<h1>Join BookNest</h1>
<form class="form" method="post">
  <label>Full name<input name="name" required></label>
  <label>Email<input type="email" name="email" required></label>
  <label>City<input name="city" placeholder="So borrowers know where you are"></label>
  <label>Password<input type="password" name="password" minlength="6" required></label>
  <button class="btn">Create account</button>
  <p class="muted small">Already a member? <a href="{{ url_for('login') }}">Log in</a></p>
</form>
{% endblock %}
